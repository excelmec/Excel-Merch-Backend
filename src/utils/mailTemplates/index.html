<head>

  <style type="text/css">
    @media only screen and (min-width: 620px) {
      .u-row {
        width: 600px !important;
      }
      .u-row .u-col {
        vertical-align: top;
      }
      .u-row .u-col-100 {
        width: 600px !important;

      .u-row-container {
        max-width: 100% !important;
        padding-left: 0px !important;
        padding-right: 0px !important;
      }
      .u-row .u-col {
        min-width: 320px !important;
        max-width: 100% !important;
        display: block !important;
      }
      .u-row {
        width: 100% !important;
      }
      .u-col {
        width: 100% !important;
      }
      .u-col > div {
        margin: 0 auto;
      }
      .mobile-padding {
        padding-left: 20px !important;
        padding-right: 20px !important;
      }
      .mobile-text-center {
        text-align: center !important;
      }
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
    }

    table, tr, td {
      vertical-align: top;
      border-collapse: collapse;
    }

    p {
      margin: 0;
    }

    .ie-container table,
    .mso-container table {
      table-layout: fixed;
    }

    * {
      line-height: inherit;
    }

    a[x-apple-data-detectors='true'] {
      color: inherit !important;
      text-decoration: none !important;
    }

    /* Modern gradient header */
    .gradient-bg {
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
    }

    /* Card shadow effect */
    .card-shadow {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* Button styles */
    .modern-button {
      background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
      border-radius: 8px;
      padding: 14px 32px;
      color: #000000;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .modern-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.5);
    }

    /* Social icons */
    .social-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 8px;
      transition: all 0.3s ease;
    }

    .social-icon:hover {
      background: rgba(212, 175, 55, 0.3);
      transform: translateY(-2px);
    }
  </style>

<body style="margin: 0; padding: 0; background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%); padding: 40px 0;">
    <tr>
      <td align="center">
        <!-- Main Container -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 48px rgba(212, 175, 55, 0.2), 0 4px 16px rgba(0, 0, 0, 0.12);">
          
          <!-- Header Section with Gradient -->
          <tr>
            <td style="background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%); padding: 55px 50px 58px; text-align: center; border-bottom: 1px solid #D4AF37;">
              <!-- Logo/Icon -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="padding-bottom: 32px;">
                    <img src="https://storage.googleapis.com/excel-mec-static-25/resources/LogoWithTextTransparent.png" alt="Excel Merch" style="width: 100px; height: auto; display: block; margin: 0 auto; opacity: 0.95;" />
                  </td>
                </tr>
              </table>
              
              <!-- Main Header -->
              <h1 style="margin: 0; padding: 0; color: #FFD700; font-family: 'Playfair Display', Georgia, serif; font-size: 42px; font-weight: 700; line-height: 1.15; letter-spacing: 1px;">
                {{MAIN_HEADER}}
              </h1>
              
              <!-- Date -->
              <p style="margin: 22px 0 0 0; padding: 0; color: #D4AF37; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase;">
                {{DATE}}
              </p>
            </td>
          </tr>

          <!-- Body Content Section -->
          <tr>
            <td style="padding: 55px 50px 60px; background: #ffffff;">
              <!-- Body Header -->
              <h2 style="margin: 0 0 28px 0; padding: 0; color: #1a1a1a; font-family: 'Playball', cursive; font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: 0.2px;">
                {{BODY_HEADER}}
              </h2>
              
              <!-- Body Text -->
              <div style="margin: 0; padding: 0; color: #3a3a3a; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; line-height: 1.8; font-weight: 400; letter-spacing: 0.2px;">
                {{BODY_TEXT}}
              </div>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding: 0 50px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="height: 2px; background: linear-gradient(90deg, rgba(212,175,55,0) 0%, rgba(212,175,55,0.3) 50%, rgba(212,175,55,0) 100%);"></td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Help Section -->
          <tr>
            <td style="padding: 50px 50px 55px; background: #ffffff; text-align: center;">
              <h3 style="margin: 0 0 16px 0; padding: 0; color: #1a1a1a; font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: 0.3px;">
                Need Help?
              </h3>
              
              <p style="margin: 0 0 32px 0; padding: 0; color: #5a5a5a; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; line-height: 1.6; letter-spacing: 0.3px;">
                Our dedicated team is at your service
              </p>
              
              <!-- Contact Button -->
              <a href="mailto:support@excelmec.org?subject=Support%20Request%3A%20Excel%20Merchandise" style="display: inline-block; background: #000000; color: #FFD700; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; text-decoration: none; padding: 16px 42px; border-radius: 4px; letter-spacing: 1.2px; text-transform: uppercase; border: 1px solid #D4AF37;">
                Contact Us
              </a>
            </td>
          </tr>

          <!-- Footer Section -->
          <tr>
            <td style="background: linear-gradient(135deg, #0d0d0d 0%, #000000 100%); padding: 45px 50px 38px; text-align: center; border-top: 1px solid #D4AF37;">
              <!-- Social Media Icons -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="padding-bottom: 32px;">
                    <table cellpadding="0" cellspacing="0" border="0" style="display: inline-block;">
                      <tr>
                        <td style="padding: 0 10px;">
                          <a href="https://www.instagram.com/excelmec/" target="_blank" style="display: inline-block; width: 42px; height: 42px; background: rgba(212, 175, 55, 0.12); border-radius: 50%; text-align: center; line-height: 42px; border: 1px solid rgba(212, 175, 55, 0.4); opacity: 0.9; transition: opacity 0.3s ease;">
                            <img
                              src="https://storage.googleapis.com/excel-mec-static-25/resources/Instagram.png"
                              width="20"
                              alt="Instagram"
                              style="display:block;margin:11px auto 0;border:0;height:auto;"
                            >
                          </a>
                        </td>
                        <td style="padding: 0 10px;">
                          <a href="https://www.linkedin.com/company/excelmec/" target="_blank" style="display: inline-block; width: 42px; height: 42px; background: rgba(212, 175, 55, 0.12); border-radius: 50%; text-align: center; line-height: 42px; border: 1px solid rgba(212, 175, 55, 0.4); opacity: 0.9; transition: opacity 0.3s ease;">
                            <img
                              src="https://storage.googleapis.com/excel-mec-static-25/resources/LinkedIn.png"
                              width="20"
                              alt="Instagram"
                              style="display:block;margin:11px auto 0;border:0;height:auto;"
                            >
                          </a>
                        </td>
                        <td style="padding: 0 10px;">
                          <a href="https://www.facebook.com/excelmec" target="_blank" style="display: inline-block; width: 42px; height: 42px; background: rgba(212, 175, 55, 0.12); border-radius: 50%; text-align: center; line-height: 42px; border: 1px solid rgba(212, 175, 55, 0.4); opacity: 0.9; transition: opacity 0.3s ease;">
                            <img
                              src="https://storage.googleapis.com/excel-mec-static-25/resources/Facebook.png"
                              width="20"
                              alt="Instagram"
                              style="display:block;margin:11px auto 0;border:0;height:auto;"
                            >
                          </a>
                        </td>
                        <td style="padding: 0 10px;">
                          <a href="https://twitter.com/excelmec" target="_blank" style="display: inline-block; width: 42px; height: 42px; background: rgba(212, 175, 55, 0.12); border-radius: 50%; text-align: center; line-height: 42px; border: 1px solid rgba(212, 175, 55, 0.4); opacity: 0.9; transition: opacity 0.3s ease;">
                            <img
                              src="https://storage.googleapis.com/excel-mec-static-25/resources/X.png"
                              width="20"
                              alt="Instagram"
                              style="display:block;margin:11px auto 0;border:0;height:auto;"
                            >
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              
              <!-- Footer Text -->
              <p style="margin: 0; padding: 0 0 8px 0; color: #D4AF37; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; line-height: 1.6; font-weight: 500; letter-spacing: 0.8px;">
                MODEL ENGINEERING COLLEGE
              </p>
              <p style="margin: 0; padding: 0 0 12px 0; color: #D4AF37; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; line-height: 1.6; font-weight: 400; letter-spacing: 0.5px; opacity: 0.85;">
                Thrikkakara · Kochi · Kerala 682021
              </p>
              <p style="margin: 0; padding: 20px 0 0 0; color: #FFD700; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; line-height: 1.5; opacity: 0.7; letter-spacing: 0.8px;">
                © 2025 EXCEL MEC · ALL RIGHTS RESERVED
              </p>
            </td>
          </tr>

        </table>
        <!-- End Main Container -->

        <!-- Bottom Spacing -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%;">
          <tr>
            <td style="padding: 28px 20px;">
              <p style="margin: 0; text-align: center; color: #D4AF37; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; opacity: 0.6; line-height: 1.5; letter-spacing: 0.8px;">
                THIS MESSAGE WAS SENT TO YOU AS A VALUED EXCEL MERCH CLIENT
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
